name: Release (Windows)

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Check versions (and the tag, if any)
        shell: pwsh
        run: |
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = ([regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          "package.json $npm, Cargo.toml $cargo, tauri.conf.json $tauri"
          if ($npm -ne $cargo -or $npm -ne $tauri) { throw "Versions differ" }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$npm") { throw "Tag $env:GITHUB_REF_NAME does not match version v$npm" }
          if (-not (Select-String -Path RELEASE_NOTES.md -Pattern "^# Polotno v$([regex]::Escape($npm))$" -Quiet)) { throw "RELEASE_NOTES.md must start with '# Polotno v$npm'" }

      - name: Build Windows installer and executable
        run: npx tauri build

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/Polotno_${version}_x64-setup.exe" -Destination "release/Polotno_${version}_x64-setup.exe" -ErrorAction Stop
          Copy-Item -LiteralPath 'src-tauri/target/release/polotno.exe' -Destination "release/Polotno_${version}_x64-portable.exe" -ErrorAction Stop
          $hashes = Get-ChildItem release/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), ($hashes -join "`n") + "`n", [System.Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v4
        with:
          name: polotno-windows
          path: release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: polotno-windows
          path: release

      - name: Verify release assets
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          assets=("release/Polotno_${version}_x64-setup.exe" "release/Polotno_${version}_x64-portable.exe" "release/SHA256SUMS.txt")
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Polotno v${version}" --notes-file RELEASE_NOTES.md --verify-tag
          fi
